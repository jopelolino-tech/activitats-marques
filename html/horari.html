<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Activitats Marques</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./../css/style.css">
    <link rel="stylesheet" href="./../css/colors.css">
</head>

<body>
    <header>
        <h1>Horari setmanal</h1>
    </header>
    <main>
        <table border="1">
            <thead>
                <tr>
                    <th>Horari</th>
                    <th>Dilluns</th>
                    <th>Dimarts</th>
                    <th>Dimecres</th>
                    <th>Dijous</th>
                    <th>Divendres</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="time-col">8:00 - 9:00</td>
                    <td rowspan="2" class="aso">ASO</td>
                    <td rowspan="3" class="bbdd">BBDD</td>
                    <td rowspan="2" class="hlld">HLLD</td>
                    <td rowspan="2" class="ipo1">IPO1</td>
                    <td rowspan="2" class="aso">ASO</td>
                </tr>
                <tr>
                    <td class="time-col">9:00-10:00</td>
                </tr>
                <tr>
                    <td class="time-col">10:00-11:00</td>
                    <td class="marques">Marques</td>
                    <td class="tutoria">Tutoria</td>
                    <td class="bbdd">BBDD</td>
                    <td class="sx">SX</td>
                </tr>
                <tr>
                    <td class="time-col">Pati</td>
                    <td colspan="5" class="pati">PATI</td>
                </tr>
                <tr>
                    <td class="time-col">11:30-12:30</td>
                    <td class="marques">Marques</td>
                    <td rowspan="3" class="iso">ISO</td>
                    <td class="fm">FM</td>
                    <td class="bbdd">BBDD</td>
                    <td class="sx">SX</td>
                </tr>
                <tr>
                    <td class="time-col">12:30-13:30</td>
                    <td class="hlld">HLLD</td>
                    <td class="ipo2">IPO2</td>
                    <td class="iso">ISO</td>
                    <td class="fm">FM</td>
                </tr>
                <tr>
                    <td class="time-col">13:30-14:30</td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="ipo1">IPO1</td>
                    <td class="ipo2">IPO2</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>

</html>
